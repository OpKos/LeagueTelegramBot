version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    ports:
      - "${API_PORT:-8000}:80"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./app/:/app/

  db:
    ports:
      - "${DB_PORT:-5432}:5432"
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: "${DB_NAME:-bot}"
      POSTGRES_USER: "${DB_USER:-bot}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-bot}"
    env_file:
      - .env
    command: postgres -c 'max_connections=${DB_MAX_CONNECTIONS:-1000}'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bot} -d ${DB_NAME:-bot}"]
      interval: "${HC_INTERVAL:-10s}"
      timeout: "${HC_TIMEOUT:-10s}"
      retries: 5
      start_period: 10s
    restart: unless-stopped
    shm_size: "1gb"

volumes:
  db-data:
